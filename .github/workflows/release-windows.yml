name: attested-windows-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3

      - name: Install exact lockfile
        run: npm ci --ignore-scripts

      - name: Verify source
        run: |
          npm test
          npm run check

      - name: Build deterministic package
        shell: pwsh
        run: npm run package:windows

      - name: Attest release provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.sha256

      - name: Collect offline attestation bundle
        shell: pwsh
        env:
          ATG_ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: Copy-Item -LiteralPath $env:ATG_ATTESTATION_BUNDLE -Destination release/attestation.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attested-windows-release
          path: |
            release/*.zip
            release/*.sha256
            release/attestation.json
          if-no-files-found: error
